name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release-and-publish-package:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ant-design-blazor'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: 'true'

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          include-prerelease: true

      - name: Package and publish to Nuget📦
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing Version: ${VERSION}"
          dotnet restore AntDesign.Icons.sln
          dotnet build AntDesign.Icons.sln --configuration Release --no-restore
          dotnet pack src/AntDesign.Icons/AntDesign.Icons.csproj \
            --configuration Release --no-build --output publish \
            -p:PackageVersion="$VERSION"
          dotnet nuget push publish/*.nupkg --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
