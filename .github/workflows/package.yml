name: Publish Package

on:
  push:
    branches:
      - master

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ant-design-blazor'

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: 'true'

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          include-prerelease: true

      - name: Package Nightly Nuget 📦
        run: |
          suffix="$(date '+%y%m%d%H%M%S')"
          dotnet restore AntDesign.Icons.sln
          dotnet build AntDesign.Icons.sln --configuration Release --no-restore
          dotnet pack src/AntDesign.Icons/AntDesign.Icons.csproj \
            --configuration Release --no-build --output publish \
            -p:PackageVersion="0.1.0-nightly-${suffix}"

      - name: Publish to Nuget ✔
        run: |
          dotnet nuget push publish/*.nupkg --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
